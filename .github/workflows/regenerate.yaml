# Regenerates the models from the latest Kubernetes 1.38.x OpenAPI spec with the
# kubex-codegen release pinned in .kubex-codegen-version, and opens (or updates) a
# pull request when anything changed.
#
# A pull request opened with the workflow's GITHUB_TOKEN doesn't start other
# workflows, so CI doesn't run on it by itself. This job runs the same checks
# first (kubex-codegen's ruff and strict mypy verify, and the tests); to run CI
# on the pull request as well, close and reopen it.

name: Regenerate

on:
  schedule:
    - cron: "23 4 * * 1"  # Mondays, 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regenerate
  cancel-in-progress: false

env:
  K8S_VERSION: "1.38"
  BRANCH: kubex-codegen/regenerate

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0

      - name: Regenerate
        id: regenerate
        env:
          # kubex-codegen looks up Kubernetes releases through the GitHub API
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CODEGEN="$(tr -d '[:space:]' < .kubex-codegen-version)"
          LOG="$RUNNER_TEMP/regenerate.log"
          uv run --locked --with "kubex-codegen @ git+https://github.com/kubex-py/kubex-codegen@${CODEGEN}" \
            kubex-codegen regenerate --k8s-version "$K8S_VERSION" --package-dir . | tee "$LOG"
          uv lock
          echo "codegen=$CODEGEN" >> "$GITHUB_OUTPUT"
          echo "tag=$(sed -n 's/^Resolved .* -> \(v[^ ]*\)$/\1/p' "$LOG")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          uv sync --locked
          uv run --no-sync pytest

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          K8S_TAG: ${{ steps.regenerate.outputs.tag }}
          CODEGEN: ${{ steps.regenerate.outputs.codegen }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The models are up to date with Kubernetes $K8S_TAG."
            exit 0
          fi
          TITLE="Regenerate from Kubernetes $K8S_TAG with kubex-codegen $CODEGEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          BODY="Generated by the Regenerate workflow from the Kubernetes $K8S_TAG OpenAPI spec with kubex-codegen $CODEGEN. The workflow already ran kubex-codegen's verify (ruff, strict mypy) and the tests; close and reopen this pull request to run CI as well. Bump the version in pyproject.toml before releasing."
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
          fi
